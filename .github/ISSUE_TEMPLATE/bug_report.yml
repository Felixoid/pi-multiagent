name: Bug report
description: Report a focused pi-multiagent bug
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened? Include exact `agent_team` action, output, diagnostics, or artifact paths when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened according to the current README, skill, or schema?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal graph/action, commands, package version, Pi version, and environment needed to reproduce.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, terminal artifacts, `run_status`, `step_result`, screenshots, or command output. Redact secrets.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: Is this a regression, docs mismatch, runtime failure, packaging issue, or operator-experience issue?
    validations:
      required: false
